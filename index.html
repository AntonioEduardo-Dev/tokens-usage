<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumo diário — terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --fg: #e0e0e0;
      --muted: #6b6b6b;
      --accent: #00ff00;
      --accent-dim: rgba(0,255,0,.14);
      --line: #3a3a3a;
      --border: #252525;
      --radius: 0px;
      --font-mono: "Fira Code", "Anonymous Pro", "Courier New", monospace;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
    }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }

    /* header */
    header { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
    .title-block h1 { font-family: var(--font-mono); font-size: 28px; font-weight: 400; letter-spacing: -.02em; margin: 0; }
    .title-block p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    /* filtros */
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .filters select, .filters input {
      font-family: var(--font-mono); font-size: 12px; padding: 6px 10px;
      background: var(--border); border: 1px solid var(--line);
      color: var(--fg); border-radius: 0; min-width: 150px;
    }
    .filters input { flex: 1; min-width: 220px; }
    .filters select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 12 8' fill='none' stroke='%236b6b6b'%3E%3Cpath d='M2 2l5 5 5-5'%3E%3C/path%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 8px top 50%; padding-right: 28px; }
    .filters select:focus, .filters input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    .refresh { font: 500 13px/1 var(--font-mono); color: #fff; background: var(--ink); border: 1px solid var(--ink); border-radius: 0; padding: 8px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background .12s ease; }
    .refresh:hover { background: var(--accent); color: #000; }
    .refresh:active { background: #00cc00; }
    .refresh:disabled { opacity: .4; cursor: not-allowed; }
    .refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .refresh svg { width: 14px; height: 14px; }
    .refresh.busy svg { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    /* summary */
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); }
    .summary .cell { display: flex; flex-direction: column; }
    .summary .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .summary .value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; }

    /* table */
    .table-shell { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; font-size: 11px; color: var(--muted); padding: 8px 0 4px; }
    thead th { font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing:.08em; padding: 0 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
    thead th:hover { color: var(--fg); }
    thead th.asc:after { content: " ▼"; color: var(--accent); font-size: .6em; }
    thead th.desc:after { content: " ▲"; color: var(--accent); font-size: .6em; }
    thead th:first-child { padding-left: 0; }
    thead th.num { text-align: right; }
    tbody td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody td:first-child { padding-left: 0; }
    tbody tr { transition: background .1s ease; }
    tbody tr:hover { background: rgba(0,255,0,.06); }
    tbody tr:last-child td { border-bottom: 1px solid var(--border); }

    .date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); white-space: nowrap; }
    .agent { display: inline-block; font-size: 11px; padding: 1px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; color: var(--accent); white-space: nowrap; }
    .models { color: var(--muted); font-size: 11px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); white-space: nowrap; }
    td.total { position: relative; }
    .bar { position: absolute; left: 0; bottom: 4px; height: 2px; background: var(--accent); opacity: .3; border-radius: 0; transition: width .3s ease; }
    td.cost { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--accent); }

    tfoot td { padding: 12px 8px 0; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    tfoot td:first-child { padding-left: 0; text-align: left; }
    tfoot td.num, tfoot td.cost { text-align: right; }
    tfoot td.cost { color: var(--fg); font-weight: 600; }

    .empty, .error-row { padding: 40px 0; text-align: center; color: var(--muted); font-size: 14px; }
    .error-row { color: #ff6b6b; }

    footer.note { margin-top: 18px; font-size: 11px; color: var(--muted); }
    footer.note code { font-family: var(--font-mono); font-size: 11px; background: var(--surface); color: var(--accent); padding: 2px 6px; border-radius: 0; }

    @media (max-width: 600px) {
      .wrap { padding: 16px 12px; }
      .summary { grid-template-columns: 1fr; }
      .filters { gap: 4px; }
      .filters input { min-width: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="title-block">
        <h1>Consumo diário</h1>
        <p>Tokens e custo por dia — <code>ccusage daily</code></p>
      </div>

      <div class="filters" role="region" aria-label="Filtros de visualização">
        <select id="filterAgent" aria-label="Filtrar por agente">
          <option value="">Todos os agentes</option>
        </select>
        <input id="filterModel" type="search" placeholder="Buscar modelo…" aria-label="Filtrar por modelo">
        <button id="btnUpdate" class="refresh" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
          <span id="btnLabel">Atualizar</span>
        </button>
        <button id="btnExport" class="refresh" type="button" aria-label="Exportar dados como JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3a10 10 0 1 1 20 0v-2a2 2 0 0 1 2-2h3m3 0v10"></path>
          </svg>
          <span class="sr-only">Exportar</span>
        </button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </header>

    <section class="summary" aria-label="Resumo">
      <div class="cell"><div class="label">Custo total</div><div class="value" id="sumCost">—</div></div>
      <div class="cell"><div class="label">Tokens totais</div><div class="value" id="sumTokens">—</div></div>
      <div class="cell"><div class="label">Dias registrados</div><div class="value" id="sumDays">—</div></div>
    </section>

    <div class="table-shell">
      <table>
        <caption id="caption">Carregando…</caption>
        <thead>
          <tr>
            <th scope="col" data-key="period">Data <span class="sort-indicator"></span></th>
            <th scope="col">Agente <span class="sort-indicator"></span></th>
            <th scope="col">Modelos <span class="sort-indicator"></span></th>
            <th scope="col" data-key="inputTokens" class="num">Entrada</th>
            <th scope="col" data-key="outputTokens" class="num">Saída</th>
            <th scope="col" class="num">Cache</th>
            <th scope="col" data-key="totalTokens" class="num">Total <span class="sort-indicator"></span></th>
            <th scope="col" data-key="totalCost" class="num">Custo</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="empty">Ainda sem dados. Clique em Atualizar.</td></tr>
        </tbody>
        <tfoot id="tfoot" hidden>
          <tr>
            <td colspan="3">Total do período</td>
            <td class="num" id="footIn"></td>
            <td class="num" id="footOut"></td>
            <td class="num" id="footCache"></td>
            <td class="num" id="footTotal"></td>
            <td class="cost" id="footCost"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <footer class="note">
      Dados em <code>sessionStorage</code>. Clique nos cabeçalhos para ordenar. <button id="btnClear" class="refresh" style="margin-left:8px; padding:4px 8px; font-size:11px;">Limpar cache</button>
    </footer>
  </main>

  <script>
    const nf = new Intl.NumberFormat('pt-BR');
    const cf = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD' });
    const compact = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });

    const $ = (id) => document.getElementById(id);
    const tbody = $('tbody');
    const btn = $('btnUpdate');
    const btnLabel = $('btnLabel');
    const statusEl = $('status');
    const caption = $('caption');
    const tfoot = $('tfoot');
    const filterAgent = $('filterAgent');
    const filterModel = $('filterModel');

    let rows = [];
    let maxTotal = 1;
    let sortKey = 'period';
    let sortDir = 'desc';

    function fmtDate(period) {
      if (!period) return '—';
      const [y, m, d] = period.split('-');
      if (!y || !m || !d) return period;
      return `${d}/${m}/${y}`;
    }

    function escHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('error', isError);
    }

    function applyFilters(data) {
      const agentVal = filterAgent.value.trim().toLowerCase();
      const modelVal = filterModel.value.trim().toLowerCase();
      return data.filter(r => {
        const agentMatch = !agentVal || (r.agent || '').toLowerCase().includes(agentVal);
        const models = r.modelsUsed || [];
        const modelMatch = !modelVal || models.some(m => m.toLowerCase().includes(modelVal));
        return agentMatch && modelMatch;
      });
    }

    function summarize(data) {
      const tokens = data.reduce((a, r) => a + (r.totalTokens || 0), 0);
      const cost = data.reduce((a, r) => a + (r.totalCost || 0), 0);
      const days = new Set(data.map((r) => r.period)).size;
      $('sumCost').textContent = cf.format(cost);
      $('sumTokens').textContent = `${compact.format(tokens)} tokens`;
      $('sumDays').textContent = `${nf.format(days)} ${days === 1 ? 'dia' : 'dias'}`;
    }

    function render(data) {
      data = applyFilters(data);
      rows = Array.isArray(data) ? data.slice() : [];
      rows.sort((a, b) => {
        const av = sortDir === 'desc' ? b[sortKey] : a[sortKey];
        const bv = sortDir === 'desc' ? a[sortKey] : b[sortKey];
        if (typeof av === 'string') return av.localeCompare(bv);
        return av - bv;
      });
      maxTotal = Math.max(1, ...rows.map((r) => r.totalTokens || 0));

      tbody.innerHTML = '';
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">Nenhum registro corresponde aos filtros.</td></tr>';
        tfoot.hidden = true;
        caption.textContent = 'Sem dados';
        summarize([]);
        return;
      }

      const frag = document.createDocumentFragment();
      for (const r of rows) {
        const cache = (r.cacheCreationTokens || 0) + (r.cacheReadTokens || 0);
        const total = r.totalTokens || 0;
        const pct = Math.max(2, Math.round((total / maxTotal) * 100));
        const models = (r.modelsUsed || []).join(', ');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="date">${fmtDate(r.period)}</td>
          <td><span class="agent">${escHtml(r.agent || '—')}</span></td>
          <td class="models" title="${escHtml(models)}">${escHtml(models || '—')}</td>
          <td class="num">${nf.format(r.inputTokens || 0)}</td>
          <td class="num">${nf.format(r.outputTokens || 0)}</td>
          <td class="num">${nf.format(cache)}</td>
          <td class="num total">${nf.format(total)}<span class="bar" style="width:${pct}%"></span></td>
          <td class="cost">${cf.format(r.totalCost || 0)}</td>`;
        frag.appendChild(tr);
      }
      tbody.appendChild(frag);

      const sum = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
      $('footIn').textContent = nf.format(sum('inputTokens'));
      $('footOut').textContent = nf.format(sum('outputTokens'));
      $('footCache').textContent = nf.format(sum('cacheCreationTokens') + sum('cacheReadTokens'));
      $('footTotal').textContent = nf.format(sum('totalTokens'));
      $('footCost').textContent = cf.format(sum('totalCost'));
      tfoot.hidden = false;

      const first = rows[rows.length - 1].period;
      const last = rows[0].period;
      caption.textContent = `${rows.length} ${rows.length === 1 ? 'registro' : 'registros'} • ${fmtDate(first)} a ${fmtDate(last)}`;
      summarize(rows);
    }

    function renderError(msg) {
      tbody.innerHTML = `<tr><td colspan="8" class="error-row">${escHtml(msg)}</td></tr>`;
      tfoot.hidden = true;
      caption.textContent = 'Falha ao carregar';
      summarize([]);
    }

    // populando agente no filtro
    function populateAgentFilter(data) {
      const agents = [...new Set(data.map((r) => r.agent).filter(Boolean))].sort();
      const optAll = document.createElement('option');
      optAll.value = '';
      optAll.textContent = 'Todos os agentes';
      filterAgent.appendChild(optAll);
      agents.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        filterAgent.appendChild(opt);
      });
    }

    let busy = false;
    async function update() {
      if (busy) return;
      busy = true;
      btn.disabled = true;
      btn.classList.add('busy');
      btnLabel.textContent = 'Atualizando';
      setStatus('executando ccusage…');

      const started = performance.now();
      try {
        const res = await fetch('/api/ccusage-daily', { method: 'POST' });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        const data = Array.isArray(body) ? body : [];
        sessionStorage.setItem('ccusageDaily', JSON.stringify(data));
        render(data);
        setStatus(`atualizado em ${((performance.now() - started) / 1000).toFixed(1)}s`);
      } catch (err) {
        renderError('Não foi possível executar ccusage. ' + err.message);
        setStatus('falhou', true);
      } finally {
        busy = false;
        btn.disabled = false;
        btn.classList.remove('busy');
        btnLabel.textContent = 'Atualizar';
      }
    }

    // filtros em tempo real
    filterAgent.addEventListener('change', () => {
      const cached = sessionStorage.getItem('ccusageDaily');
      if (cached) {
        try {
          render(JSON.parse(cached));
        } catch (_) { setStatus(''); }
      }
    });

    filterModel.addEventListener('change', () => {
      const cached = sessionStorage.getItem('ccusageDaily');
      if (cached) {
        try {
          render(JSON.parse(cached));
        } catch (_) { setStatus(''); }
      }
    });

    // ordenação de cabeçalho
    tbody.parentElement.addEventListener('click', e => {
      const th = e.target.closest('th');
      if (!th || !th.dataset.key) return;
      if (sortKey === th.dataset.key) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      else { sortKey = th.dataset.key; sortDir = 'desc'; }
      render(rows);
      document.querySelectorAll('thead th').forEach(t => t.classList.remove('asc', 'desc'));
      th.classList.add(sortDir);
    });

    // limpar sessionStorage
    document.getElementById('btnClear').addEventListener('click', () => {
      sessionStorage.removeItem('ccusageDaily');
      location.reload();
    });

    btn.addEventListener('click', update);

    const cached = sessionStorage.getItem('ccusageDaily');
    if (cached) {
      try {
        const data = JSON.parse(cached);
        populateAgentFilter(data);
        render(data);
        setStatus('dados da sessão');
      } catch (_) {
        setStatus('');
        caption.textContent = 'Clique em Atualizar para buscar os dados.';
      }
    } else {
      setStatus('');
      caption.textContent = 'Clique em Atualizar para buscar os dados.';
    }
  </script>
</body>
</html>
